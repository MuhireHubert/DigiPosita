    {letter: {id_expr: "uuidV4()"}, fileName: "report.pdf", fileUrl: "http://storage.com/1.pdf"},
    {letter: {id_expr: "uuidV4()"}, fileName: "image.png", fileUrl: "http://storage.com/2.png"},
    {letter: {id_expr: "uuidV4()"}, fileName: "notes.txt", fileUrl: "http://storage.com/3.txt"}
  ])
  letterAssignment_insertMany(data: [
    {letter: {id_expr: "uuidV4()"}, folder: {id_expr: "uuidV4()"}},
    {letter: {id_expr: "uuidV4()"}, folder: {id_expr: "uuidV4()"}},
    {letter: {id_expr: "uuidV4()"}, folder: {id_expr: "uuidV4()"}}
  ])
